# On a version tag (v*): build, run the host tests, publish a GitHub release with the firmware,
# and put the web flasher (site/) with that firmware on GitHub Pages (SPEC 7.7).
# The firmware has no credentials in it: WiFi and the device password are set up on the device
# (SPEC 7.1). include/secrets.h is gitignored, so it is never in this build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # git describe gives the firmware its version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool==4.8.1

      - name: No credentials in the build
        run: test ! -e include/secrets.h

      - name: Build
        run: pio run -e m5stack-atom -e xiao-carrier

      - name: Host tests
        run: pio test -e native

      # Flash layout of the Arduino core (its platformio-build.py): bootloader at 0x1000 on the ESP32
      # and 0x0 on the ESP32-S3; partition table 0x8000, boot_app0 (OTA data) 0xe000, app 0x10000.
      # Atom Lite: 4 MB, DIO, 40 MHz. XIAO ESP32-S3: 8 MB, DIO, 80 MHz (PlatformIO turns the board's
      # QIO into DIO for the bootloader; its header says DIO / 8 MB / 80 MHz).
      # Each board's files go in its own folder under site/firmware/; the manifest has one build
      # per chip, and the flasher picks the one for the chip it finds.
      - name: Package
        run: |
          VER=$(git describe --tags --always)
          BOOT_APP0=~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          mkdir -p dist
          package() {  # env chip boot-offset flash-freq flash-size
            B=.pio/build/$1
            mkdir -p site/firmware/$1
            cp $B/bootloader.bin $B/partitions.bin $BOOT_APP0 $B/firmware.bin site/firmware/$1/
            # One file for esptool: write it at 0x0 on a fresh board
            python -m esptool --chip $2 merge_bin -o dist/ais-gateway-$VER-$1-full.bin \
              --flash_mode dio --flash_freq $4 --flash_size $5 \
              $3 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BOOT_APP0 0x10000 $B/firmware.bin
            # The app alone: for updates over WiFi (Settings > Firmware update, POST /ota, or espota)
            cp $B/firmware.bin dist/ais-gateway-$VER-$1-update.bin
          }
          package m5stack-atom esp32 0x1000 40m 4MB
          package xiao-carrier esp32s3 0x0 80m 8MB
          sed "s/@VERSION@/$VER/" site/manifest.template.json > site/firmware/manifest.json
          rm site/manifest.template.json
          echo "VER=$VER" >> $GITHUB_ENV

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VER" dist/* --title "AIS Gateway $VER" --generate-notes

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
