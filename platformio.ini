; PlatformIO Configuration for M5 Atom Lite AIS Gateway
; Hardware: M5 Atom Lite + CAN unit + TAIL 485

[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    https://github.com/ttlappalainen/NMEA2000.git
    https://github.com/ttlappalainen/NMEA2000_esp32.git
    https://github.com/ttlappalainen/NMEA0183.git
    fastled/FastLED@^3.6.0

build_flags =
    -D ESP32_CAN_TX_PIN=GPIO_NUM_22
    -D ESP32_CAN_RX_PIN=GPIO_NUM_19
