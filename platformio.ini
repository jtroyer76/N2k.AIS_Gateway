; PlatformIO Configuration for M5 Atom Lite AIS Gateway
; Hardware: M5 Atom Lite + CAN unit + TAIL 485
;
; Builds are reproducible: the platform and every library are pinned (SPEC §4 rule 5).
; The CAN driver is our own NMEA2000_esp32_idf_twai, pinned by git tag.
; include/secrets.h is optional, for development boards only (SPEC 7.1). Release builds never
; contain it: WiFi, the device password and the AIS baud are set up on the device.

[env:m5stack-atom]
platform = espressif32 @ 6.8.1
board = m5stack-atom
framework = arduino
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:scripts/version.py  ; FW_VERSION from git describe (SPEC 7.7)

lib_deps =
    ttlappalainen/NMEA2000-library @ 4.24.1
    ttlappalainen/NMEA0183 @ 1.10.1
    fastled/FastLED @ 3.6.0
    https://github.com/jtroyer76/NMEA2000_esp32_idf_twai.git#v0.1.0

; OTA over WiFi (SPEC 5.10). Export the device password as AIS_OTA_PASS first. Through the fallback hotspot:
;   pio run -e m5stack-atom-ota -t upload --upload-port 192.168.4.1
[env:m5stack-atom-ota]
extends = env:m5stack-atom
upload_protocol = espota
upload_port = ais-gateway.local
upload_flags = --auth=${sysenv.AIS_OTA_PASS}

; Host-side unit tests (`pio test -e native`, needs a host gcc/g++ on PATH):
;   test/test_conversion  AIS -> N2k conversion fed with real !AIVDM sentences
;   test/test_logic       LED pattern, WiFi fallback policy, rollback policy, raw-sentence ring
;   test/test_settings    settings sources, validation, made-up device password
;   test/test_web         console log ring, JSON writer, /api/log response
[env:native]
platform = native @ 1.2.1
build_flags =
    -std=gnu++17
    -D UNITY_INCLUDE_DOUBLE
    -static-libstdc++  ; no libstdc++/libgcc DLLs to pick up on Windows; also links on Linux (CI)
    -static-libgcc
lib_deps =
    ttlappalainen/NMEA2000-library @ 4.24.1
    AIS_Decoder
lib_ignore =
    NMEA2000_esp32_idf_twai  ; ESP32-only; tested in its own repo
test_build_src = no
