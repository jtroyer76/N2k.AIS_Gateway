; PlatformIO Configuration for M5 Atom Lite AIS Gateway
; Hardware: M5 Atom Lite + CAN unit + TAIL 485
;
; Builds are reproducible: the platform and every library are pinned (SPEC §4 rule 5).

[env:m5stack-atom]
platform = espressif32 @ 6.8.1
board = m5stack-atom
framework = arduino
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    ttlappalainen/NMEA2000-library @ 4.24.1
    ttlappalainen/NMEA0183 @ 1.10.1
    fastled/FastLED @ 3.6.0
    ; Temporary: still used through NMEA2000_CAN.h until the CAN driver switches to the
    ; vendored lib/NMEA2000_esp32_twai (SPEC §5.3). Remove then.
    https://github.com/ttlappalainen/NMEA2000_esp32.git#15cc30887f0e629fbee0821c5b1de03d130728ac

build_flags =
    -D ESP32_CAN_TX_PIN=GPIO_NUM_22
    -D ESP32_CAN_RX_PIN=GPIO_NUM_19

; Host-side unit tests: AIS -> N2k conversion fed with real !AIVDM sentences (test/test_conversion).
; Run with `pio test -e native`. Needs a host gcc/g++ on PATH.
[env:native]
platform = native @ 1.2.1
build_flags =
    -std=gnu++17
    -D UNITY_INCLUDE_DOUBLE
    -Wl,-static  ; self-contained test exe (avoids picking up a different libstdc++ DLL on Windows)
lib_deps =
    ttlappalainen/NMEA2000-library @ 4.24.1
    AIS_Decoder
lib_ignore =
    NMEA2000_esp32_twai
test_build_src = no
